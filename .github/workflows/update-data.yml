name: 📈 Update BRVM Data

on:
  schedule:
    # 18h30 UTC = 18h30 Abidjan (UTC+0) — après clôture du marché BRVM (15h30)
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du déclenchement manuel'
        default: 'Mise à jour manuelle'

permissions:
  contents: write

jobs:
  update-brvm-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Récupérer le code ─────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Python + dépendances ──────────────────────────────────────────
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install playwright requests beautifulsoup4 lxml feedparser --quiet
          playwright install chromium --with-deps --quiet

      # ── 3. Scraping BOA Direct + actualités ─────────────────────────────
      - name: 🔄 Scrape BRVM data
        run: python scripts/brvm_scrape_boa.py
        env:
          PYTHONUNBUFFERED: '1'

      # ── 4. Vérifier qu'il y a des données ───────────────────────────────
      - name: ✅ Verify output
        run: |
          echo "=== brvm_cours.json ==="
          python3 -c "
          import json
          data = json.load(open('brvm_cours.json'))
          print(f'  {len(data)} titres dans brvm_cours.json')
          for d in data[:3]:
              print(f\"  {d['ticker']:8} {d['price']:>10,.0f} FCFA  {d['var1d']:+.2f}%\")
          "

      # ── 5. Commit et push si changements ────────────────────────────────
      - name: 📤 Commit & push data
        run: |
          git config user.name  "BRVM Bot 🤖"
          git config user.email "brvm-bot@users.noreply.github.com"
          git add brvm_cours.json brvm_actualites.json

          # Ne committer que si les données ont changé
          if git diff --staged --quiet; then
            echo "ℹ️  Aucun changement — données identiques à hier"
          else
            NBSTOCKS=$(python3 -c "import json; print(len(json.load(open('brvm_cours.json'))))")
            git commit -m "📈 MAJ cours BRVM — $(date +'%d/%m/%Y %H:%M') — $NBSTOCKS titres"
            git push
            echo "✅ Données committées et poussées"
          fi
